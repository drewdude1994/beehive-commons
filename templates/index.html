<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Beehive // Algorithmic Commons</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-amber-50 text-black font-mono p-4">
<div class="video-bg-container" id="video-container">
<video autoplay muted loop playsinline class="bg-video" id="bg-video" onerror="document.getElementById('video-container').style.display='none'"><source src="/static/videos/background-loop.mp4" type="video/mp4"><source src="/static/boomerang.mp4" type="video/mp4"></video>
<div class="video-overlay"></div></div>
<header class="border-b-2 border-black pb-4 mb-6 flex justify-between items-center relative z-10">
<div><h1 style="color:#FFEB3B; -webkit-text-stroke:2px black; text-shadow:-2px -2px 0 black,2px -2px 0 black,-2px 2px 0 black,2px 2px 0 black; font-weight:900;" class="text-xl">// THE BEEHIVE COMMONS</h1></div>
<nav class="space-x-2">
<button id="btn-menu" class="px-3 py-1 border-2 border-black bg-white text-xs font-bold">HOME</button>
<button id="btn-creator" class="px-3 py-1 border-2 border-black bg-white text-xs font-bold">+ POST NEED</button>
<button id="btn-marketplace" class="px-3 py-1 border-2 border-black bg-white text-xs font-bold">JOBS</button>
<button id="btn-profile" class="px-3 py-1 border-2 border-black bg-white text-xs font-bold">PROFILE</button>
</nav></header>
<div id="view-menu" class="max-w-xl mx-auto space-y-4 py-8 relative z-10" style="display:block;">
<div class="border-2 border-black p-6 bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
<div id="paypal-banner" class="border-2 border-black bg-white p-3 text-xs font-bold mb-4">Loading PayPal status...</div>
<h2 class="text-2xl font-bold mb-2">OPERATOR DASHBOARD</h2>
<p class="text-sm text-gray-600 mb-6">PayPal 98.6/1.4 LIVE - Local http://10.0.0.83:5000</p>
<div class="grid grid-cols-1 gap-3">
<button id="card-creator" class="p-4 border-2 border-black text-left font-bold">+ Post a New Need</button>
<button id="card-marketplace" class="p-4 border-2 border-black text-left font-bold">Browse Jobs</button>
<button id="card-profile" class="p-4 border-2 border-black text-left font-bold">My Profile</button>
</div></div>
<div class="border-2 border-black p-4 bg-white mt-4"><h3 class="font-bold text-sm mb-2">// PAYPAL PAYOUTS - 1.4% FEE SPLIT</h3><div id="payouts-list">Loading...</div></div>
</div>
<div id="view-creator" class="max-w-xl mx-auto space-y-4 relative z-10" style="display:none;"><h2 class="text-xl font-bold">// CREATE A NEED</h2><div class="border-2 border-black p-4 bg-white"><form id="need-form" class="space-y-3"><div><label class="text-xs font-bold">Title:</label><input id="need-title" type="text" required class="w-full border-2 border-black p-2 mt-1"></div><div><label class="text-xs font-bold">Description:</label><textarea id="need-desc" class="w-full border-2 border-black p-2 mt-1"></textarea></div><div class="grid grid-cols-2 gap-2"><div><label class="text-xs font-bold">Amount $/HC:</label><input id="need-baseline" type="number" value="10" class="w-full border-2 border-black p-2 mt-1"></div><div><label class="text-xs font-bold">Urgency:</label><input id="need-urgency" type="number" value="5" class="w-full border-2 border-black p-2 mt-1"></div></div><button type="submit" class="w-full bg-black text-white font-bold p-2 border-2 border-black">SUBMIT NEED</button></form></div></div>
<div id="view-marketplace" class="max-w-xl mx-auto space-y-4 relative z-10" style="display:none;"><h2 class="text-xl font-bold">// AVAILABLE JOBS</h2><div id="needs-list">Loading...</div></div>
<div id="view-profile" class="max-w-xl mx-auto space-y-4 relative z-10" style="display:none;"><h2 class="text-xl font-bold">// OPERATOR PROFILE</h2><div class="border-2 border-black p-4 bg-white space-y-4"><div class="flex border-b-2 border-black pb-2 space-x-2"><button id="tab-login" class="px-4 py-1 border-2 border-black bg-black text-white text-xs font-bold">LOG IN</button><button id="tab-create" class="px-4 py-1 border-2 border-black bg-white text-black text-xs font-bold">CREATE NEW PROFILE</button></div><div id="section-login" class="space-y-3"><div><label class="text-xs font-bold">Handle:</label><input id="login-name" type="text" class="w-full border-2 border-black p-2 mt-1"></div><div><label class="text-xs font-bold">Password:</label><input id="login-password" type="password" class="w-full border-2 border-black p-2 mt-1"></div><button id="btn-submit-login" class="w-full bg-black text-white font-bold p-2 border-2 border-black">ACCESS PROFILE</button></div><div id="section-create" class="space-y-3" style="display:none;"><form id="profile-form" class="space-y-3"><div><label class="text-xs font-bold">Operator Name:</label><input id="prof-name" type="text" required class="w-full border-2 border-black p-2 mt-1"></div><div><label class="text-xs font-bold">PayPal Email:</label><input id="prof-paypal" type="email" required class="w-full border-2 border-black p-2 mt-1"></div><div><label class="text-xs font-bold">Password:</label><input id="prof-password" type="password" required class="w-full border-2 border-black p-2 mt-1"></div><div><label class="text-xs font-bold">Confirm:</label><input id="prof-password-confirm" type="password" required class="w-full border-2 border-black p-2 mt-1"></div><button type="submit" class="w-full bg-black text-white font-bold p-2 border-2 border-black">CREATE OPERATOR</button></form></div><div id="profile-info" class="text-xs"></div><div id="operators-list" class="text-xs"></div></div></div>
<script>
function switchView(id){["menu","creator","marketplace","profile"].forEach(v=>{let el=document.getElementById("view-"+v); if(el) el.style.display=(v===id)?"block":"none";}); if(id==="marketplace") loadNeeds(); if(id==="profile") loadOperators(); if(id==="menu"){loadPayPalConfig(); loadPayouts();}}
async function loadNeeds(){try{let res=await fetch("/api/needs"); let data=await res.json(); let div=document.getElementById("needs-list"); if(!data||data.length===0){div.innerHTML="<p class='text-xs'>No jobs yet.</p>"; return;} div.innerHTML=data.map(n=>`<div class='border-2 border-black p-3 bg-white mb-2'><div class='font-bold text-sm'>${n.type} - ${n.barter_value} HC ($${n.gross_usd})</div><div class='text-xs'>${n.description||''}</div><div class='text-xs mt-2'>Net: ${n.net_hc} HC ($${n.net_usd}) Fee: ${n.fee_hc} HC</div><button onclick="claimNeed('${n.id}')" class='mt-2 px-3 py-1 bg-black text-white text-xs font-bold'>CLAIM + GET PAID</button></div>`).join("");}catch(e){}}
async function claimNeed(id){let op=localStorage.getItem("beehive_operator_id")||prompt("Operator handle:"); if(!op) return; let res=await fetch("/api/claim",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({need_id:id, operator_id:op})}); alert(JSON.stringify(await res.json())); loadNeeds();}
document.addEventListener("DOMContentLoaded", ()=>{switchView("menu"); loadPayPalConfig(); loadPayouts(); loadOperators();});
async function loadPayPalConfig(){try{let res=await fetch("/api/config"); let cfg=await res.json(); let b=document.getElementById("paypal-banner"); if(!b) return; if(cfg.PAYPAL_ENABLED){b.innerHTML=`✅ PayPal LIVE (${cfg.PAYPAL_MODE}) - Workers 98.6% to ${cfg.PLATFORM_PAYPAL_EMAIL} Platform 1.4%`; b.className="border-2 border-green-600 bg-green-50 p-3 text-xs font-bold mb-4";}else{b.innerHTML=`⚠️ TEST MODE - HC credited, PayPal pending. Fee 1.4% -> ${cfg.PLATFORM_PAYPAL_EMAIL}`; b.className="border-2 border-yellow-600 bg-yellow-50 p-3 text-xs font-bold mb-4";}}catch(e){}}
async function loadPayouts(){try{let res=await fetch("/api/payouts"); let data=await res.json(); let div=document.getElementById("payouts-list"); if(!div) return; if(!data||data.length===0){div.innerHTML="<p class='text-xs'>No payouts yet.</p>"; return;} div.innerHTML=data.slice(0,20).map(p=>`<div class='border border-black p-2 mb-2 text-xs'><b>${p.type}</b> -> ${p.to_email} $${p.net_amount} ${p.status}</div>`).join("");}catch(e){}}
async function loadOperators(){try{let res=await fetch("/api/operators"); let data=await res.json(); let div=document.getElementById("operators-list"); if(!div) return; div.innerHTML=data.filter(o=>o.id!=="hive_platform").map(o=>`<div class="border-b border-black py-2"><b>${o.name||o.id}</b> - ${o.paypal_email_masked||''} - ${o.hc_balance} HC</div>`).join("");}catch(e){}}
["menu","creator","marketplace","profile"].forEach(id=>{let btn=document.getElementById("btn-"+id); if(btn) btn.addEventListener("click", ()=>switchView(id)); let card=document.getElementById("card-"+id); if(card) card.addEventListener("click", ()=>switchView(id));});
const tabLogin=document.getElementById("tab-login"); const tabCreate=document.getElementById("tab-create"); const sectionLogin=document.getElementById("section-login"); const sectionCreate=document.getElementById("section-create");
if(tabLogin&&tabCreate){tabLogin.addEventListener("click", ()=>{tabLogin.className="px-4 py-1 border-2 border-black bg-black text-white text-xs font-bold"; tabCreate.className="px-4 py-1 border-2 border-black bg-white text-black text-xs font-bold"; sectionLogin.style.display="block"; sectionCreate.style.display="none";}); tabCreate.addEventListener("click", ()=>{tabCreate.className="px-4 py-1 border-2 border-black bg-black text-white text-xs font-bold"; tabLogin.className="px-4 py-1 border-2 border-black bg-white text-black text-xs font-bold"; sectionCreate.style.display="block"; sectionLogin.style.display="none";});}
document.getElementById("profile-form")?.addEventListener("submit", async (e)=>{e.preventDefault(); let name=document.getElementById("prof-name").value; let paypal=document.getElementById("prof-paypal").value; let pass=document.getElementById("prof-password").value; let confirm=document.getElementById("prof-password-confirm").value; if(pass!==confirm){alert("Passwords don't match"); return;} let res=await fetch("/api/create_operator",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:name.toLowerCase().replace(/\s+/g,"_"), name:name, paypal:paypal, password:pass})}); let j=await res.json(); if(j.error){alert(j.error); return;} localStorage.setItem("beehive_operator_id", j.id); alert("Created "+j.id); loadOperators();});
document.getElementById("btn-submit-login")?.addEventListener("click", async ()=>{let name=document.getElementById("login-name").value; let pass=document.getElementById("login-password").value; let res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:name, password:pass})}); let j=await res.json(); if(j.error){alert(j.error); return;} localStorage.setItem("beehive_operator_id", j.id); document.getElementById("profile-info").innerHTML=`<div class='border-2 border-black p-2'><b>${j.name}</b> ${j.hc_balance} HC</div>`;});
document.getElementById("need-form")?.addEventListener("submit", async (e)=>{e.preventDefault(); let title=document.getElementById("need-title").value; let desc=document.getElementById("need-desc").value; let baseline=parseFloat(document.getElementById("need-baseline").value); let urgency=parseFloat(document.getElementById("need-urgency").value); let res=await fetch("/api/create_need",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:title,description:desc,baseline,desirability:0.5,urgency,posted_by:localStorage.getItem("beehive_operator_id")||"operator",required_pools:["real_world_ops"]})}); let j=await res.json(); alert("Created "+j.id); switchView("marketplace");});
</script>
</body>
</html>
